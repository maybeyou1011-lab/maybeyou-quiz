<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>燈泡菌・益生菌檢測中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* ───── 7 色燈泡菌主色 + 飲品色（整站共用色票）───── */
  :root{
    --red:#ec5b54; --orange:#f59a3c; --yellow:#eec843;
    --green:#4cbf86; --blue:#5aa9e6; --indigo:#7d72e0; --purple:#b667cf;
    --ink:#403a36; --muted:#9b9186; --line:#ece4d8; --bg:#f7f1e8;
    --card:#fffdf8; --serif:'Noto Serif TC',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Noto Sans TC',sans-serif;color:var(--ink);min-height:100vh;
    background:linear-gradient(178deg,#faf5ed 0%,#f5eee2 55%,#f1e8d9 100%)}
  .wrap{max-width:480px;width:100%;margin:0 auto;min-height:100vh;position:relative;background:transparent;overflow:hidden}
  /* 背景暖光柔暈（整站漂浮，對齊主視覺的自然柔光）*/
  .wrap::before{content:'';position:fixed;top:-130px;left:-90px;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,rgba(245,154,60,.13),transparent 70%);pointer-events:none;z-index:0}
  .wrap::after{content:'';position:fixed;bottom:-130px;right:-100px;width:320px;height:320px;border-radius:50%;
    background:radial-gradient(circle,rgba(182,103,207,.11),transparent 70%);pointer-events:none;z-index:0}
  section,.fixed-layer{position:relative;z-index:1}
  .hidden{display:none!important}

  /* ───── 7 色燈泡列（裝飾）───── */
  .bulb-row{display:flex;justify-content:center;gap:7px;margin-bottom:18px}
  .bulb-dot{width:18px;height:18px;border-radius:50%;position:relative;animation:pop .5s backwards}
  .bulb-dot::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 12px currentColor;opacity:.6}
  @keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

  /* ───── 通用按鈕 ───── */
  .btn{display:block;width:100%;border:none;border-radius:50px;font-family:inherit;font-weight:700;
    cursor:pointer;letter-spacing:1px;transition:transform .15s,box-shadow .25s,filter .2s}
  .btn:active{transform:scale(.97)}
  .btn-lg{padding:17px;font-size:16px}
  .btn-rainbow{color:#fff;background:linear-gradient(95deg,var(--red),var(--orange),var(--green),var(--blue),var(--purple));
    background-size:200% 100%;box-shadow:0 10px 26px rgba(123,110,240,.28);animation:rainbowShift 6s linear infinite}
  @keyframes rainbowShift{to{background-position:200% 0}}
  .btn-rainbow:hover{filter:brightness(1.05);box-shadow:0 14px 32px rgba(123,110,240,.36)}
  .btn-dark{background:var(--ink);color:#fff;box-shadow:0 8px 22px rgba(38,36,46,.22)}
  .btn-dark:hover{filter:brightness(1.15)}
  .btn-line{background:linear-gradient(135deg,#06c755,#0fae50);color:#fff;box-shadow:0 8px 22px rgba(6,199,85,.3)}
  .btn-ghost{background:transparent;color:var(--muted);box-shadow:none;font-weight:500;padding:12px;font-size:14px}
  .btn-ghost:hover{color:var(--ink)}

  /* ───── 1. Landing ───── */
  .landing{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:56px 26px 40px;text-align:center}
  .l-badge{display:inline-block;align-self:center;font-size:12px;font-weight:700;letter-spacing:3px;color:var(--indigo);
    background:#fff;border:1px solid var(--line);padding:7px 16px;border-radius:50px;margin-bottom:22px}
  .landing h1{font-size:31px;line-height:1.38;font-weight:900;margin-bottom:14px}
  .rainbow-text{background:linear-gradient(95deg,var(--red),var(--orange),var(--green),var(--blue),var(--purple));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .landing .sub{font-size:15px;color:var(--muted);line-height:1.85;margin-bottom:28px}
  .stat-row{display:flex;gap:10px;margin-bottom:30px}
  .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 6px;box-shadow:0 6px 18px rgba(123,110,240,.06)}
  .stat .n{font-size:23px;font-weight:900;line-height:1.1}
  .stat .t{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
  .l-note{margin-top:14px;font-size:12px;color:var(--muted)}
  .l-foot{margin-top:24px;font-size:12px;color:var(--muted)}
  .l-foot b{color:var(--indigo)}

  /* ───── 2. Quiz ───── */
  .topbar{position:sticky;top:0;background:rgba(251,250,255,.92);backdrop-filter:blur(8px);
    padding:16px 22px 12px;z-index:5}
  .seg-row{display:flex;gap:5px;margin-bottom:8px}
  .seg{flex:1;height:6px;border-radius:4px;background:var(--line);transition:background .4s}
  .seg.done{background:var(--c)}
  .seg.cur{background:var(--c);box-shadow:0 0 8px var(--c)}
  .seg-text{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;letter-spacing:.5px}
  .seg-text b{color:var(--ink)}

  .q-area{padding:18px 22px 30px;animation:slideIn .4s ease}
  @keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
  .q-eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:8px}
  .q-title{font-size:23px;font-weight:900;line-height:1.45;margin-bottom:22px}
  .opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;font-family:inherit;
    background:#fff;border:2px solid var(--line);border-radius:18px;padding:15px 16px;margin-bottom:11px;
    font-size:15px;color:#4a4754;cursor:pointer;transition:all .18s;line-height:1.45}
  .opt:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.06)}
  .opt .o-ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:21px;flex-shrink:0;background:var(--bg);transition:all .2s}
  .opt.sel{border-color:var(--c);background:var(--soft);color:var(--ink);font-weight:700}
  .opt.sel .o-ic{background:var(--c);transform:scale(1.05)}

  /* 開場複選：7 色卡 */
  .copt{position:relative;display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;font-family:inherit;
    background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 44px 14px 14px;margin-bottom:10px;cursor:pointer;transition:all .18s}
  .copt:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.06)}
  .copt .pic{width:42px;height:42px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--csoft)}
  .copt.sel .pic{background:var(--cc)}
  .copt .cbody{flex:1}
  .copt .cname{font-size:15.5px;font-weight:800;line-height:1.4}
  .copt .cfunc{font-size:12.5px;color:#5a5764;margin-top:3px;line-height:1.5}
  .copt .cwho{font-size:11px;color:var(--muted);margin-top:5px}
  .copt .ck{position:absolute;top:14px;right:13px;width:23px;height:23px;border-radius:50%;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .18s}
  .copt.sel{border-color:var(--cc);background:var(--csoft)}
  .copt.sel .ck{background:var(--cc);border-color:var(--cc);color:#fff}
  .next-wrap{position:sticky;bottom:0;padding:14px 0 4px;background:linear-gradient(transparent,var(--bg) 30%)}
  .btn-next{opacity:.4;pointer-events:none}
  .btn-next.on{opacity:1;pointer-events:auto}

  /* 答完的小回饋 banner */
  .feedback{position:fixed;left:50%;top:18%;transform:translateX(-50%) translateY(-12px);
    background:var(--ink);color:#fff;padding:12px 22px;border-radius:40px;font-size:14px;font-weight:500;
    z-index:200;opacity:0;pointer-events:none;transition:all .35s;box-shadow:0 10px 30px rgba(0,0,0,.2);white-space:nowrap}
  .feedback.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ───── 3. Analyzing ───── */
  .analyze{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center}
  .scanner{width:130px;height:130px;border-radius:50%;margin-bottom:30px;position:relative;
    background:conic-gradient(var(--red),var(--orange),var(--yellow),var(--green),var(--blue),var(--indigo),var(--purple),var(--red));
    animation:spin 1.2s linear infinite}
  .scanner::after{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--bg)}
  .scanner .core{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;z-index:1;animation:pulse 1s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{transform:scale(1.12)}}
  .ana-line{font-size:15px;color:#5a5764;margin-bottom:9px;opacity:0;transition:opacity .4s;min-height:24px}
  .ana-line.show{opacity:1}
  .ana-line b{font-weight:700}

  /* ───── 4. Report（檢測報告・主秀）───── */
  .report{padding:24px 18px 96px;animation:fadeUp .5s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .rep-head{text-align:center;margin-bottom:10px}
  .rep-kicker{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--indigo);margin-bottom:6px}
  .rep-head h2{font-size:22px;font-weight:900}
  .rep-head .for{font-size:13px;color:var(--muted);margin-top:4px}

  .card{background:var(--card);border-radius:24px;padding:24px 20px;box-shadow:0 8px 28px rgba(80,70,140,.08);margin-bottom:14px}

  /* 總分儀表 */
  .score-card{text-align:center}
  .gauge-box{position:relative;width:170px;height:170px;margin:6px auto 4px}
  .gauge{transform:rotate(-90deg)}
  .gauge .bg{fill:none;stroke:var(--line);stroke-width:13}
  .gauge .fg{fill:none;stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.4,0,.2,1)}
  .gauge-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge-mid .num{font-size:48px;font-weight:900;line-height:1}
  .gauge-mid .unit{font-size:13px;color:var(--muted);margin-top:2px}
  .grade-tag{display:inline-block;padding:6px 18px;border-radius:50px;font-size:13px;font-weight:700;color:#fff;margin-top:8px}
  .score-say{font-size:13px;color:#5a5764;line-height:1.8;margin-top:12px}

  /* 面向長條 */
  .dim-h{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--muted);margin-bottom:14px;text-align:left}
  .dim{margin-bottom:15px}
  .dim:last-child{margin-bottom:0}
  .dim-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .dim-name{font-size:14px;font-weight:700}
  .dim-name .flag{font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:20px;margin-left:6px}
  .dim-score{font-size:13px;font-weight:700;color:var(--muted)}
  .dim-bar{height:11px;border-radius:6px;background:var(--line);overflow:hidden}
  .dim-fill{height:100%;border-radius:6px;width:0;transition:width 1s cubic-bezier(.4,0,.2,1)}

  /* 缺哪些菌 */
  .need-h{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px;text-align:left}
  .need-grid{display:flex;flex-wrap:wrap;gap:9px}
  .need-pill{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
    border-radius:50px;padding:8px 14px 8px 10px;font-size:13px;font-weight:600}
  .need-pill .nd{width:18px;height:18px;border-radius:50%;box-shadow:0 0 8px currentColor}

  /* 配方卡 */
  .combo-card{background:linear-gradient(150deg,#fff,var(--bg));border:2px solid transparent;
    background-clip:padding-box;position:relative}
  .combo-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;color:#fff;
    padding:5px 14px;border-radius:50px;margin-bottom:12px;
    background:linear-gradient(95deg,var(--orange),var(--purple))}
  .combo-name{font-size:26px;font-weight:900;margin-bottom:4px}
  .combo-code{font-size:13px;color:var(--muted);margin-bottom:14px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:50px;font-size:13px;font-weight:700;color:#fff}
  .pill .cnt{background:rgba(255,255,255,.3);width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
  .combo-desc{font-size:13.5px;color:#5a5764;line-height:1.85;text-align:left;background:var(--bg);
    border-radius:16px;padding:15px;border-left:4px solid var(--indigo);margin-bottom:14px}

  /* 一天怎麼喝 */
  .tl-h{font-size:13px;font-weight:700;color:var(--muted);text-align:left;margin-bottom:10px}
  .tl{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
  .tl:last-child{border-bottom:none}
  .tl-ic{font-size:24px;width:38px;text-align:center;flex-shrink:0}
  .tl-b{flex:1;text-align:left}
  .tl-when{font-size:12px;font-weight:700;color:var(--indigo)}
  .tl-what{font-size:14px;font-weight:700;margin-top:1px}
  .tl-why{font-size:12px;color:var(--muted);margin-top:1px}

  /* 工具包定價 */
  .pack{text-align:left}
  .pack-name{font-size:20px;font-weight:900;margin-bottom:4px}
  .pack-tag{font-size:13px;color:var(--muted);margin-bottom:14px}
  .pack-reason{background:var(--bg);border-radius:14px;padding:14px;font-size:13px;color:#5a5764;line-height:1.8;margin-bottom:16px}
  .pack-reason b{color:var(--orange)}
  .price-line{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .price-now{font-size:30px;font-weight:900;color:var(--red)}
  .price-old{font-size:15px;color:#bbb;text-decoration:line-through}
  .price-save{margin-left:auto;font-size:12px;font-weight:700;color:var(--green);background:#e7f8f0;padding:4px 10px;border-radius:20px}
  .price-hold{font-size:12px;color:var(--muted);margin-top:8px}

  /* 加購 */
  .addon-h{font-size:13px;color:var(--muted);margin-bottom:10px;text-align:left}
  .addon{display:flex;gap:11px;align-items:center;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:all .18s}
  .addon:hover{border-color:var(--indigo)}
  .addon-thumb{width:40px;height:40px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
  .addon-mid{flex:1;text-align:left}
  .addon-name{font-size:14px;font-weight:700}
  .addon-price{font-size:12px;color:var(--muted)}
  .addon input{width:20px;height:20px;accent-color:var(--indigo)}

  /* sticky 結帳 bar（報告頁捲動出現）*/
  .sticky-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;
    background:#fff;box-shadow:0 -8px 24px rgba(0,0,0,.1);padding:12px 16px 15px;z-index:60;
    display:none;gap:12px;align-items:center;border-top:1px solid var(--line)}
  .sticky-bar.show{display:flex;animation:barUp .35s ease}
  @keyframes barUp{from{transform:translate(-50%,90px)}to{transform:translate(-50%,0)}}
  .sticky-bar .sb-price{flex:1}
  .sticky-bar .sb-now{font-size:21px;font-weight:900;color:var(--red);display:block;line-height:1.1}
  .sticky-bar .sb-meta{font-size:11px;color:var(--muted)}
  .sticky-bar .sb-meta b{color:var(--green)}
  .sticky-bar .btn{width:auto;padding:13px 24px;font-size:14px}

  /* ───── 5~7. Funnel（購物金 / 註冊 / LINE / 購物車）───── */
  .pad{padding:30px 20px 40px;animation:fadeUp .4s ease}
  .center{text-align:center}
  .topic-icon{width:74px;height:74px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:34px;
    background:linear-gradient(135deg,var(--orange),var(--purple));color:#fff;box-shadow:0 10px 28px rgba(182,95,209,.3)}
  .h-kicker{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--indigo);text-align:center;margin-bottom:8px}
  .h-big{font-size:24px;font-weight:900;text-align:center;line-height:1.5;margin-bottom:8px}
  .h-sub{font-size:14px;color:var(--muted);text-align:center;line-height:1.8;margin-bottom:22px}
  .perk{display:flex;gap:13px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px}
  .perk-ic{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;border:1px solid var(--line)}
  .perk-main{font-size:15px;font-weight:700}
  .perk-sub{font-size:12px;color:var(--muted);line-height:1.5}
  .perk-amt{margin-left:auto;font-size:20px;font-weight:900;color:var(--red)}
  .total{background:var(--ink);color:#fff;border-radius:16px;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;margin:14px 0 20px}
  .total .l{font-size:13px;opacity:.7}
  .total .a{font-size:25px;font-weight:900;color:var(--yellow)}

  .field{margin-bottom:15px}
  .field label{font-size:13px;font-weight:600;color:#5a5764;margin-bottom:6px;display:block}
  .field input{width:100%;padding:14px 15px;font-size:15px;border:1.5px solid var(--line);border-radius:14px;font-family:inherit;background:var(--bg)}
  .field input:focus{outline:none;border-color:var(--indigo);background:#fff}
  .field .hint{font-size:11px;color:var(--orange);margin-top:6px}
  .banner-gift{display:flex;gap:13px;align-items:center;background:linear-gradient(135deg,var(--orange),var(--yellow));color:#fff;border-radius:16px;padding:16px;margin-bottom:16px}
  .banner-gift .cake{font-size:32px}
  .banner-gift b{font-size:16px;display:block}
  .banner-gift small{opacity:.92;font-size:12px}

  .line-ok{display:inline-flex;align-items:center;gap:8px;background:#e7f8ef;color:#2f9e63;padding:9px 18px;border-radius:50px;font-size:13px;font-weight:700;margin-bottom:16px}
  .line-bonus{display:inline-block;background:linear-gradient(135deg,#06c755,#0fae50);color:#fff;padding:6px 16px;border-radius:14px;font-size:13px;font-weight:700;margin-bottom:12px}
  .qr{width:180px;height:180px;margin:0 auto 20px;border-radius:18px;background:#fff;padding:12px;box-shadow:0 8px 26px rgba(6,199,85,.18);border:1px solid var(--line)}
  .qr img{width:100%;height:100%;display:block;border-radius:8px}

  .cart-card{background:#fff;border-radius:20px;padding:22px 20px;box-shadow:0 8px 28px rgba(80,70,140,.08);margin-bottom:13px}
  .crow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .crow:last-of-type{border-bottom:none}
  .crow.disc{color:var(--green);font-weight:600}
  .ctotal{display:flex;justify-content:space-between;font-size:18px;font-weight:900;padding-top:13px;border-top:2px solid var(--line);margin-top:6px}
  .cnote{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:13px;color:var(--indigo);margin-bottom:13px;font-weight:600}
  .curge{background:var(--ink);color:#fff;border-radius:14px;padding:13px 15px;font-size:13px;margin-bottom:16px;line-height:1.7}
  .curge b{color:var(--yellow)}

  .restart{text-align:center;padding:18px}

  /* ═══════════ 溫柔主視覺風格（對齊官方「亮著哪盞燈」主視覺）═══════════ */
  /* 標題一律改明體，內文維持黑體 */
  .landing h1,.q-title,.rep-head h2,.combo-name,.h-big,.pack-name,.gauge-mid .num{font-family:var(--serif);letter-spacing:1px}

  /* 彩虹細線（標題下方裝飾，呼應主視覺的漸層線）*/
  .rainbow-line{height:3px;width:62px;border-radius:3px;margin:14px auto 0;
    background:linear-gradient(90deg,var(--blue),var(--green),var(--yellow),var(--orange),var(--red),var(--purple))}
  .spark{color:var(--orange);font-weight:400}

  /* Landing：溫柔療癒版 */
  .landing{padding:46px 28px 46px;text-align:center}

/* 7 題計分：每題該色 0-3 分 + 痛點勾選參考(+1.5) + 18 以下成長微調 */
function scoreColors(){
  var s={}; BULB7.forEach(function(c){s[c]=0;});
  BULB7.forEach(function(c){ s[c]+=parseInt(answers[c],10)||0; });
  (answers.pains||[]).forEach(function(id){
    var p=PAINS.filter(function(x){return x.id===id;})[0];
    if(p && s[p.color]!=null) s[p.color]+=1.5;
  });
  if(answers.age==='teen'){ s.yellow+=1; s.green+=1; } // 18 以下偏成長：骨骼＋腸胃
  return s;
}

/* 可推薦的顏色：18 歲以下（teen）不出紅色（控醣減重）與紫色（美白），不適合小朋友 */
function availColors(){
  return answers.age==='teen' ? BULB7.filter(function(c){return c!=='red' && c!=='purple';}) : BULB7;
}

/* 一天 4 顆：依嚴重度（分數）分配，最該補的色可到 2 顆 */
function recommendMix(){
  var s=scoreColors(), COLS=availColors(), qty={}; COLS.forEach(function(c){qty[c]=0;});
  var sum=function(){ return COLS.reduce(function(a,c){return a+qty[c];},0); };
  // 第一輪：貪婪取邊際分數最高的色，單色上限 2，只給有需求(>0)的
  for(var k=0;k<4;k++){
    var best=null,bv=-1;
    COLS.forEach(function(c){ if(s[c]<=0||qty[c]>=2)return; var v=s[c]/(qty[c]+1); if(v>bv){bv=v;best=c;} });
    if(best) qty[best]++;
  }
  // 補滿 4 顆（有需求的色太少時，放寬上限給分數最高色；全 0 給基礎保養）
  while(sum()<4){
    var best=null,bv=-1;
    COLS.forEach(function(c){ if(s[c]<=0)return; if(s[c]>bv){bv=s[c];best=c;} });
    if(!best){ qty.green=2; qty.yellow=1; qty.orange=1; break; }
    qty[best]++;
  }
  var mix=COLS.filter(function(c){return qty[c]>0;})
    .map(function(c){return {c:c,q:qty[c],score:s[c]};})
    .sort(function(a,b){ return b.q-a.q || b.score-a.score || BULB7.indexOf(a.c)-BULB7.indexOf(b.c); });
  return {mix:mix, scores:s};
}

/* ═══════════════════════════════════════════════════
   真實銷售套組（後台用名稱，前台不露出）

   main = 該組主色，對應測驗中最在意的那一色
   ═══════════════════════════════════════════════════ */
var COMBOS=[
  {key:'sleep',   name:'深層好睡組',     main:'orange', recipe:{red:0, orange:50,yellow:20,green:30,blue:10,indigo:10,purple:0}},
  {key:'kid',     name:'孩童長高高組',   main:'yellow', recipe:{red:5, orange:0, yellow:45,green:35,blue:25,indigo:0, purple:10}},
  {key:'beauty',  name:'日夜煥亮美白組', main:'purple', recipe:{red:15,orange:0, yellow:10,green:35,blue:0, indigo:25,purple:35}},
  {key:'intimate',name:'私密呵護組',     main:'indigo', recipe:{red:15,orange:0, yellow:0, green:35,blue:10,indigo:40,purple:20}}
];
function comboBy(key){ return COMBOS.filter(function(c){return c.key===key;})[0]; }

/* 對應規則：依「最在意的主色」挑套組
   靛→私密呵護、黃(或未成年)→孩童長高高、橙→深層好睡、紫→日夜煥亮美白
   若最高需求落在紅/綠/藍(非四組主色)，退而取配方相似度最近的那組 */
function matchCombo(){
  var s=scoreColors();
  if(answers.age==='teen') return comboBy('kid'); // 未成年直接走成長組
  var mainKeys={orange:'sleep',yellow:'kid',purple:'beauty',indigo:'intimate'};
  var order=BULB7.slice().sort(function(a,b){return s[b]-s[a];});
  for(var i=0;i<order.length;i++){
    if(mainKeys[order[i]] && s[order[i]]>0) return comboBy(mainKeys[order[i]]);
  }
  // 全部主色都 0：用相似度(內積)挑最接近的
  var best=COMBOS[0], bv=-1;
  COMBOS.forEach(function(c){
    var dot=BULB7.reduce(function(a,k){return a+(s[k]||0)*(c.recipe[k]||0);},0);
    if(dot>bv){ bv=dot; best=c; }
  });
  return best;
}

/* 把 30 天套組配方換算成「每天 4 顆」的代表性搭配(最大餘數法分配) */
function dailyFromRecipe(recipe){
  var per={}, floorSum=0, rem=[];
  BULB7.forEach(function(k){
    var v=(recipe[k]||0)/30; per[k]=Math.floor(v); floorSum+=per[k];
    rem.push({k:k, r:v-Math.floor(v), v:v});
  });
  var need=4-floorSum;
  rem.sort(function(a,b){return b.r-a.r;});
  for(var i=0;i<need;i++){ if(rem[i] && rem[i].v>0) per[rem[i].k]++; }
  return BULB7.filter(function(k){return per[k]>0;})
    .map(function(k){return {c:k, q:per[k]};})
    .sort(function(a,b){return b.q-a.q || BULB7.indexOf(a.c)-BULB7.indexOf(b.c);});
}

/* 報告：7 色需求度（分數越高＝越該補）＋ 整體健康指數 */
function clamp(n){ return Math.max(20, Math.min(98, Math.round(n))); }
function computeReport(){
  var s=scoreColors();
  var dims=availColors().map(function(c){
    return {key:c, color:c, label:DIM_LABEL[c], need:clamp(s[c]/4.5*100)};
  });
  var avgNeed=dims.reduce(function(a,d){return a+d.need;},0)/dims.length;
  var overall=clamp(100-avgNeed*0.7);          // 需求越高，健康指數越低
  var weak=dims.slice().sort(function(x,y){return y.need-x.need;}).slice(0,2); // 最該補的 2 色
  return {overall:overall, dims:dims, weak:weak};
}

      });
    });

  var sel=answers[q.id]||null;

    backHtml+
    '<div class="q-eyebrow" style="color:'+col+'">'+q.eyebrow+'</div>'+
    '<h2 class="q-title">'+q.title+'</h2>'+opts;

  document.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click', function(){

    });

}

  if(score>=80) return {label:'狀態良好',color:COLORS.green};
  if(score>=65) return {label:'尚可，有空間',color:COLORS.yellow};
  if(score>=50) return {label:'需要加強',color:COLORS.orange};
  return {label:'急需調理',color:COLORS.red};
}

        '</svg><div class="gauge-mid"><div class="num" id="gauge-num" style="color:'+grade.color+'">0</div><div class="unit">健康指數</div></div></div>'+

function animateGauge(target, circ, color){
  var fg=document.getElementById('gauge-fg'), num=document.getElementById('gauge-num');
  setTimeout(function(){ fg.style.strokeDashoffset = circ*(1-target/100); }, 250);
  var cur=0, step=Math.max(1,Math.round(target/40));
  var t=setInterval(function(){
    cur+=step; if(cur>=target){cur=target;clearInterval(t);}
    num.textContent=cur;
  }, 28);
}

  var host=document.getElementById('rep-host'); if(!host)return;
  var cols=[COLORS.red,COLORS.orange,COLORS.yellow,COLORS.green,COLORS.blue,COLORS.indigo,COLORS.purple];
  for(var i=0;i<26;i++){
    var c=document.createElement('div');
    c.style.cssText='position:absolute;width:8px;height:8px;border-radius:2px;top:60px;pointer-events:none;z-index:5;'+
      'left:'+(Math.random()*100)+'%;background:'+cols[i%7]+';'+
      'animation:cfall '+(1.6+Math.random()*1.2)+'s ease-out '+(Math.random()*.4)+'s forwards';
    host.appendChild(c);
    (function(el){ setTimeout(function(){el.remove();},3600); })(c);
  }
}

        return '<div class="crow"><span><b>個人化七色搭配包 '+x.p.days+'天</b></span><span>$'+x.p.now.toLocaleString()+' / 組</span></div>'+
          '<div style="font-size:12px;color:#8a8794;padding:4px 0 6px;line-height:1.6">每組每天 4 顆 ・ '+x.p.box+' 盒｜'+pillsDetail+'</div>'+
          '<div class="qty-row"><span>組數</span><div class="qty-ctl"><button type="button" onclick="changeCartQty('+x.i+',-1)" aria-label="減少組數">−</button><b>'+x.q+'</b><button type="button" onclick="changeCartQty('+x.i+',1)" aria-label="增加組數">＋</button></div></div>'+
          '<div class="crow" style="border-bottom:none"><span style="color:#8a8794">小計</span><span>$'+(x.p.now*x.q).toLocaleString()+'</span></div>';
      }).join('');

  document.getElementById('page-cart').innerHTML=
    '<div class="pad">'+
      '<div class="h-kicker">YOUR CART ・ 個人化七色搭配包</div>'+
      '<div class="cart-card">'+
        itemRows+
        '<div class="crow" style="border-top:1px solid var(--line);padding-top:10px"><span><b>小計（共 '+groupsTotal()+' 組）</b></span><span>$'+subtotal.toLocaleString()+'</span></div>'+
        '<div class="crow"><span>運費'+(shipFee===0?'（滿 $3,000 免運）':'（未滿 $3,000）')+'</span><span>'+(shipFee===0?'免運':'$'+shipFee)+'</span></div>'+
        discRow+
        '<div class="ctotal"><span>應付金額</span><span>$'+net.toLocaleString()+'</span></div>'+
      '</div>'+
      (shipFee>0?'<div class="curge">🚚 再買 <b>$'+(FREE_AT-subtotal).toLocaleString()+'</b> 元（約再 1 組）即可<b>免運</b></div>':'')+
      (earned>0?'<div class="cnote">🎁 完成這筆訂單後 <b>$'+earned+'</b> 購物金入帳・購物金與折價券皆為下次回購折抵，本次不折抵</div>':'<div class="cnote">🎟️ 購物金與折價券皆為下次回購折抵，本次不折抵</div>')+
      '<div class="cnote">🕊️ 為你保留至 '+nextDate(7)+'（7 天）</div>'+
      (__member||__line?'<div class="curge">⏰ <b>3 天內結帳</b>，再送一張下次回購 <b>9 折券</b></div>':noDisc)+
      '<button class="btn btn-lg btn-rainbow" onclick="goCheckout()">前往結帳</button>'+
      (!__member||!__line?'<button class="btn btn-ghost" onclick="goWallet()">回去領剩下的購物金</button>':'')+
    '</div>';
}

function goCheckout(){
  if(CONFIG.checkoutUrl){ window.location.href=CONFIG.checkoutUrl; }
  else { alert('示範到此 ・ 設定 CONFIG.checkoutUrl 後即可接綠界金流結帳'); }
}
function changeCartQty(i,d){ __qtys[i]=Math.max(0,Math.min(99,(__qtys[i]||0)+d)); goCart(); }
function nextDate(days){ var d=new Date(Date.now()+days*86400000); return (d.getMonth()+1)+'/'+d.getDate(); }

function restart(){ currentQ=0; answers={}; __mix=null; __qtys=[0,0,0]; __member=false; __line=false; show('page-landing'); }

/* confetti keyframes（用 JS 注入，避免 CSS 太長）*/
var st=document.createElement('style');
st.textContent='@keyframes cfall{0%{opacity:0;transform:translateY(-30px) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(440px) rotate(720deg)}}';
document.head.appendChild(st);

paintBulbs();
</script>
</body>
</html>
